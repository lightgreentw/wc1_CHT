; ── 其餘對話字幕（沒對上上面任何場景的，例如過場動畫）：底部 viewport (0,152,319,199) ──
[Rule.Subtitle_Bottom]
Hook=2
Rect=0,152,319,199
Use=Big15
YOffset=0

; ── 空戰：駕駛艙 ──
[Rule.Cockpit_MFD]
; 左 MFD（武器電腦 0x00614AA0）與右 MFD（導航電腦／通訊選單／鎖定資訊 0x00615460），兩個 hook 都適用
Viewport=0x00614AA0,0x00615460
Use=Tiny8

[Rule.Cockpit_CommLine]
; 空戰通訊字幕「SPIRIT: …」「Krant: …」「Tiger's Claw: …」。
; 這塊 viewport 是暫時建立的、範圍會隨座艙不同（舊座艙 18,14,301,74；新座艙 80,29,239,89），
; 所以不能用 Rect，改認呼叫端 0x004225FB（兩種座艙都一樣）
; 【SM2】SM2 的這個函式有 3 個繪製分支（通用／座艙 slot=0xA／另一個位置變體），dll 會把 0x004225FB 自動展開成
;   0x00422A9C、0x004229C6、0x00422A62 三個位址（見 log 的 [位址表] 行）。若實測某個分支不是通訊字幕，
;   改成完全手動指定（每個 exe 各自照字面）：  Caller=WC1:0x004225FB,SM1:0x0042261B,SM2:0x00422A9C
Hook=2
Caller=0x004225FB
Priority=20
Use=Small10
Shrink=Tiny8
YOffset=0

; ── 模擬器（電玩機台 / 飛行訓練）：Scene=Simulator ──
; 下面四條都加了 Scene=Simulator，只在模擬機裡生效；字型想換，只要改各條的 Use=（目前全部 Tiny8 = 8x8，跟以前一樣）。
; 駕駛艙兩個 MFD（武器電腦／導航電腦）還是由上面的 Rule.Cockpit_MFD 負責，模擬機跟真正空戰共用。
; 翻譯條目見 wc1zh_sim_additions.tsv（Score: $I、Wave $I complete…、排名畫面、SORRY 畫面）。

[Rule.Sim_Screen]
; 模擬機各畫面的整段文字（Hook2）：
;   0x00615440 前視窗 (0,0,231,80)         Wave N complete. / Bonus Points
;   0x00626DA0 選敵機                       SELECT ENEMY
;   0x00626DE0 最高得分榜                   HIGH SCORES
;   0x004A9348 輸入姓名呼號／排名／SORRY    CONGRATULATIONS! … / > SORRY <
Hook=2
Scene=Simulator
Viewport=0x00615440,0x00626DA0,0x00626DE0,0x004A9348
Priority=15
Use=Tiny8

[Rule.Sim_HUD]
; 前視窗上方 HUD（Hook1）："Score: 40000 Time: 25 1 UP" 是一個格式字串帶三個 %X（x=10／140／200），
; wc1cht.dll 會拆成三段各自翻譯、各自定位（"Score: $I"、"Time: $I"、"1 UP"），三段都有翻譯才畫中文，否則整行維持英文
Hook=1
Scene=Simulator
Viewport=0x00615440
Priority=15
Use=Tiny8

[Rule.Sim_Labels]
; 姓名輸入畫面的 CALLSIGN : / LAST NAME: / SQUADRON: TRAINSIM，以及最高得分榜每一列（"1. PALADIN" 在 x=58、分數在 x=198，一樣是兩段）
Hook=1
Scene=Simulator
Viewport=0x00626DE0,0x004A9348
Priority=15
Use=Tiny8

[Rule.Sim_NameEcho]
; 玩家輸入的姓名／呼號逐字回顯（Hook1，文字是 $N / $C；viewport 是暫時建立的，只能用呼叫端認）：不翻譯、不記成「未翻譯」
Hook=1
Scene=Simulator
Caller=0x0042D725
Priority=30
Skip=1

[Rule.Scoreboard]
; 酒吧裡的記分板
Hook=1
Viewport=0x006155A0
Use=Chalk15

[Rule.NameInput_Skip]
; ── 存檔名輸入框的逐字回顯（Hook1）：玩家輸入的字，不要翻譯、也別記成「未翻譯」──
Hook=1
Caller=0x00467F84
Priority=30
Skip=1

; 以下兩條是「沒有 Caller 時」的備用（範圍式），平常會被上面的 Caller 規則先吃掉
[Rule.Fallback_BottomLine]
Hook=2
Rect=0,0,319,199
Cursor=0,176,319,199
Use=Small10

[Rule.Fallback_FlightMapText]
Hook=2
Rect=0,0,259,155
Use=Tiny8

