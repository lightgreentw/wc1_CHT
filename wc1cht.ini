; wc1cht.ini — Wing Commander 1 中文化設定檔（UTF-8，改完請重新啟動遊戲）
; 放在 wc1cht.dll 同一個資料夾。
;
; 【部署清單：要放進遊戲目錄的檔案】
;   wc1cht.dll、本檔（wc1cht.ini），以及「本檔指定」的兩類檔案：
;   1. 翻譯對照檔：[General] 的 Translation=（目前是 wc1zh.txt）
;   2. 字型檔（CZHT 格式 .fnt）：各字型區段的 Font=，包含 [Dialogue_Hook1/2]、[Combat_Hook1/2]、[Font.名稱]
;   這些檔名都可以自訂；寫相對路徑時以 wc1cht.dll 所在資料夾為基準，也可以寫絕對路徑。
;   換翻譯檔或換字型，只要改本檔，不必重新編譯 DLL。
;
; 【多版本：Wing1_wcdx.exe / SM1_wcdx.exe / SM2_wcdx.exe / Transfer_wcdx.exe 共用同一個 dll、同一份 ini】
;   Transfer（人物傳送工具）沒有太空戰與場景，只有選單／對話框：這些規則（Menu_BottomLine、DialogBox、NameInput_Skip…）
;   會自動換成它的位址；太空戰、酒吧、簡報室等規則在 Transfer 上沒有對應位址，開啟 log 時會出現「沒有對應，已略過」，屬正常。
;   F12 debug／降速／probe／interp 四個支線模組在 Transfer 上自動不啟用。
;   本檔所有「位址」（Caller=、[SceneDrivers]、Viewport=、[Interp] RegionLo/Hi）一律照 WC1 的位址寫；
;   在 SM1 / SM2 執行時，dll 會自動換成該 exe 的位址（開啟 [Log] 後，換算結果會寫進 wc1cht_debug.log 的 [位址表] 行）。
;   想直接指定「某個 exe 專用的原始位址」（不轉換）：在位址前加 SM1: / SM2: / WC1: / TRF:（Transfer_wcdx.exe）前綴，
;   例如  Caller=0x004225FB,SM2:0x004229C6   （後者只在 SM2 生效；其他 exe 會略過它）。
;
; 【字型怎麼選？由上往下，第一個符合的生效】
;   1. [Rule.xxx] 規則：依「畫面位置/呼叫端/文字」指定字型（本檔下半部）
;   2. 都不符合 → 預設：[Dialogue_Hook1/2]、[Combat_Hook1/2] 四套（對話場景/空戰場景 × Hook1/Hook2）
;
; 【怎麼設計規則？】先把 [Log] Enable 設成 1 → 進入想調整的畫面 → 按 F9（會嗶一聲）→ 打開 wc1cht_debug.log，找最後面的
;   [情境] 標記#N Hook2  呼叫端=…  viewport=0x… (l,t,r,b)  起點=(x,y)  規則=…  字型=…  文字="…"
; 這幾行就是該畫面所有文字的來源資訊，挑能把畫面分開的欄位寫進 Rule 即可。
; 條件欄位說明請看 DLL 自動產生的預設 ini 檔尾。

[Log]
; 1 = 寫診斷 log（wc1cht_debug.log）；0 = 不寫（預設，正式使用請維持 0）。
; 載入階段的錯誤（位址驗證失敗、翻譯表／字型／設定檔載入失敗、Hook3 初始化失敗）不受此開關影響，一律記錄。
; 下面這些都要 Enable=1 才有作用：VerboseCalls、LogContexts、MarkKey（F9）、F12 模組的 Ctrl+F12 診斷傾印，
; 以及 [Speed]／[Interp]／[Probe] 的狀態訊息。
Enable=0

[General]
; 翻譯對照檔。純文字格式（英文<TAB>中文）或雜湊格式（檔頭 #wc1cht:hash=fnv1a64，由 tools/wc1cht_hash_tool.py 產生）皆可，自動判斷。相對路徑以 wc1cht.dll 所在資料夾為基準
Translation=wc1zh.trs
VerboseCalls=500
; 1 = 把沒翻譯的文字記到 wc1cht_missed.tsv；0 = 不記錄（預設）
DumpMissed=0
ClipGuard=1
MarkKey=F9
LogContexts=1
; 整句沒翻譯時，句中「詞彙表有翻譯」的名稱單獨換成中文：Talk to HUNTER. → Talk to 獵人.
; （不分大小寫；只處理不超過 TermMaxLen 字元的字串。個別規則可用 Terms=off 關掉）
TermFallback=1
TermMaxLen=40

; 對齊：auto = 每一段文字各自還原遊戲原本的對齊（置中的置中、靠左的靠左）。
; 依據：log 顯示遊戲畫每段文字前都會設定 FontContext.align_mode，
;   2（置中）：字幕、選單提示、確認框、面板標題（Briefing Nav Map／* Psi Wing *／Notes）、MFD 標題（COMP NAVIGATION／WEAPON DISPLAY）、通訊字幕
;   0（靠左）：Sector: / System:、Proceed to…、Location:、Hook1 的標籤與「Target:／Range :／RANGE」等
; 所以不需要為「同一個畫面裡有的置中有的靠左」分規則。個別規則要強制時才寫 Align=left/center/right。
DefaultAlign=auto

; ═════════════════════════ 支線：Debug 模式 / 降速（wc1cht_ext.inc）═════════════════════════
; （改完請重新啟動遊戲）

[Debug]
; Enable=0 可完全關掉 F12 功能
Enable=1
; 按這個鍵開/關 Debug 模式（等同原版 "Origin -k -b"、登錄檔 Cheater）。Ctrl+這個鍵 = 把診斷資訊寫進 log
ToggleKey=F12
; 1 = 遊戲一啟動就開 Debug 模式
AutoEnable=0
; 1 = 同時套用 -k -b（解除遊戲內部的限制檢查）；0 = 只開作弊旗標
RelaxChecks=1
; 1 = 同時設定 ctrl.del 旗標（遊戲的 Ctrl+Del / Ctrl+Ins 除了作弊旗標還要求它，見文件）
EnableCtrlDelFlag=1
; 1 = Debug 開啟時，Alt+Del / Alt+Ins 也視同 Ctrl+Del / Ctrl+Ins（原版攻略寫的是 Alt）
AltAsCtrl=1

[Speed]
; Enable=0 完全不干涉遊戲速度（F10/F11 也停用，Alt+N/M 回到遊戲原生的 ±0.5 Hz）
Enable=1
; ══ 速度只有一個單位：模擬 CPU 時脈（MHz）══════════════════════════════
; 這個引擎每個「模擬步」走固定距離，所以遊戲速度 = 每秒模擬步數（Hz）。換算：
;     Hz = CpuMHz × HzPerMHz        （預設 0.25：16MHz≈4Hz、33MHz≈8.25Hz、66MHz≈16.5Hz、80MHz≈20Hz＝遊戲原預設）
; 遊戲自己顯示的「Space Flight Max FPS」就是這個 Hz；畫面順不順（FPS 不隨速度下降）由 [Interp] 負責。
;
; 啟動時模擬的 CPU 時脈。0 = 不干涉，維持遊戲預設（20Hz ≈ 80MHz）
CpuMHz=33
; F10 / F11（以及 Alt+N / Alt+M）逐檔調慢 / 調快用的檔位（MHz，由小到大）
MHzSteps=16,20,25,33,40,50,66,80
; 校準值（估計，不是實測）。覺得 33MHz 太快就調小（例如 0.2），太慢就調大
HzPerMHz=0.25
; 想直接指定「每秒模擬步數」才用（Hz，1～32）；>0 時優先於 CpuMHz。要「比檔位更細」的速度就用這個
GameHz=0
; ══ 按鍵 ═════════════════════════════════════════════════════════
; 1 = 遊戲原生的 Alt+N（減慢）/ Alt+M（加快）改成「換 MHz 檔位」，等同 F10 / F11，不再是 ±0.5 Hz。
; 0 = 保留遊戲原生行為（±0.5 Hz，夾在 8～32）；F10/F11 仍然換檔位。
AltNM=1
; 1 = 每次切換檔位，用遊戲自己的提示訊息顯示目前檔位，例如：CPU 33 MHz [4/8] 8.25 Hz（[第幾檔/共幾檔]，Hz = 遊戲速度）。
;     F10/F11 會幫你按一次 Alt+N/M，讓遊戲自己顯示提示。0 = 不顯示、也不模擬按鍵
Hint=1
; 遊戲中按鍵調速（按住 Ctrl 時不作用，Ctrl+F10 留給 [Probe]）
SlowerKey=F10
FasterKey=F11
; ══ 其他 ═════════════════════════════════════════════════════════
; >0 才強制「非太空戰畫面」（選單/酒吧/簡報）的 FPS；0 = 維持遊戲預設 16。
; 注意：這不受 CpuMHz 影響，設了就會直接讓那些畫面變慢
OtherFps=11
; 1 = 呼叫 timeBeginPeriod(1)，讓低頻的間隔更準（遊戲本身沒呼叫，預設解析度約 15.6ms）
TimerResolution=1
; 輪詢週期（毫秒）。剛切換檔位後的 0.8 秒內會自動改用 2ms 快速輪詢
PollMs=20

[Probe]
; 實驗支線 v2：逐格記憶體觀測器（唯讀）。1 = 啟用；
Enable=0
; 在太空戰中按 Ctrl+這個鍵 開始錄製
Key=F10
; 錄幾格（8～120）。降到 5～8 FPS 時 40 格約 5～8 秒
Frames=40

[Interp]
; 多版本：RegionLo/Hi 是 WC1 位址；SM1 自動 +0x30，SM2 使用內建對應區間（0x5CBF00..0x5D1F00，暫定，需實測確認）。
;   也可直接指定該 exe 的原始位址：RegionLo_SM1= RegionHi_SM1= RegionLo_SM2= RegionHi_SM2=（四個都不寫就用內建值）
; 實驗支線 v3：子畫面內插原型（慢速但順暢）。
; 模擬頻率由 [Speed] 決定（例如 CpuMHz=33 → 約 8 Hz）；本功能讓每個模擬步多畫 Multiplier-1 個內插子畫面。
Enable=1
; 1 = 遊戲一啟動就開啟；建議先 0，進太空戰後按 Ctrl+ToggleKey 開關
AutoOn=0
; 目標顯示頻率（FPS）。>0：自動挑倍率，讓「顯示頻率 = 模擬頻率 × k」≥ 這個值（k 最大 8）。
;   這就是「遊戲變慢，但畫面 FPS 不掉」的關鍵：速度調慢時，k 會自動增加。0 = 改用下面固定的 Multiplier
TargetFps=30
; 固定倍率（2～8），只有 TargetFps=0 時才使用。顯示頻率 = 模擬頻率 × Multiplier
Multiplier=3
; 按 Ctrl+這個鍵 開/關
ToggleKey=F11
; 挑選內插欄位的條件：每步變化量要在 [MinDelta, MaxDelta]，且與上一步的變化量相差不超過 SmoothTol 倍
MinDelta=3
MaxDelta=20000000
SmoothTol=0.35
; 要掃描的遊戲狀態區（exe 的 .data 內）
RegionLo=0x621E00
RegionHi=0x626900
; 1 = 前 3 個模擬步把「繪圖+換頁改了哪些全域變數」寫進 log（副作用分析）
SideEffectLog=1

[SceneDrivers]
; 每個場景最上層的「主函式」位址。從 log（8 層呼叫鏈）找出來的：畫面上任何文字被畫出來時，
; 呼叫鏈都會經過所在場景的主函式。規則用 Scene=名稱 來引用。
; 可以寫單一位址或範圍（0xA-0xB），多個用逗號隔開；名稱隨你取。
Bar=0x0045A99D
Barracks=0x0045A9C7
Briefing=0x0045AA5E
Combat=0x0045AAB0,0x0045AAB7
HangarLanding=0x0045AAF9
Debrief=0x0045AD0F
CommanderOffice=0x0045AE2F
Awards=0x0045AE4B
; 模擬機
;   0x0045A9BD  從酒吧選「Fly training mission」進入（場景分派函式 0x0045A8F1 內，位於酒吧 0x0045A99D 與寢室 0x0045A9C7 之間的那個呼叫）
;   0x0045A892  遊戲一啟動就直接進模擬機
; 規則用 Scene=Simulator 引用。多版本：位址照 WC1 寫，SM1/SM2 會自動換算（見 log 的 [位址表] 行）。
Simulator=0x0045A9BD,0x0045A892

[Scene]
; 依 viewport 寬度判斷「空戰」的舊規則，log 顯示會誤判（99px 寬的 Loading Game 框被當成空戰、
; 其他確認框卻是對話），已改由下面的 Rule（呼叫端）負責。0 = 停用
CombatMaxWidth=0
CombatViewports=
DialogueViewports=
CombatRects=18,14,301,74

; ───────────── 預設的四套字型（沒有規則符合時使用）─────────────
[Dialogue_Hook1]
Font=.\chtfonts\boutique7.fnt
GlyphWidth=0
GlyphHeight=0
RowAlign=auto
CharSpacing=0
LineSpacing=0
YAdjust=auto

[Dialogue_Hook2]
Font=.\chtfonts\nightgazer15.fnt
GlyphWidth=0
GlyphHeight=15
RowAlign=auto
CharSpacing=1
LineSpacing=2

[Combat_Hook1]
Font=.\chtfonts\boutique7.fnt
GlyphWidth=0
GlyphHeight=0
RowAlign=auto
CharSpacing=0
LineSpacing=0
YAdjust=auto

[Combat_Hook2]
Font=.\chtfonts\boutique9.fnt
GlyphWidth=0
GlyphHeight=0
RowAlign=auto
CharSpacing=0
LineSpacing=0

; ═════════════════════════ 字型集（給規則引用）═════════════════════════
; 名稱隨你取，規則的 Use= / Shrink= 用這些名稱。
; 目前只有 8 / 10 / 15 三種大小；有 12px 的字型檔再加一個 [Font.Mid12] 即可（見最下方範例）。

[Font.Tiny8]
; 8x8：駕駛艙 MFD、星圖面板、星圖標籤
Font=.\chtfonts\boutique7.fnt
CharSpacing=0
LineSpacing=0

[Font.Small10]
; 10x10：選單提示列、空戰通訊字幕
Font=.\chtfonts\boutique9.fnt
CharSpacing=0
LineSpacing=0
YOffset=-2

[Font.Middle12]
; 12x12：UI選單
Font=.\chtfonts\nightgazer12b.fnt
GlyphHeight=0
CharSpacing=2
LineSpacing=0
YOffset=0

[Font.Big15]
; 15x15：對話字幕
Font=.\chtfonts\nightgazer15.fnt
GlyphHeight=15
CharSpacing=1
LineSpacing=2
; 中文字形比英文低約 2px → 往上挪 2px。YOffset 只位移「中文字形」，英數字（遊戲原生字型）維持原位。
YOffset=-3

[Font.Chalk15]
;15x15
Font=.\chtfonts\851tegakizatus15.fnt
CharSpacing=0
LineSpacing=0

[Font.Intro24]
; 24x24：開場字幕／製作名單（Hook3，見下方 [BigText]）。字型檔放在 wc1cht.dll 同一目錄。
Font=.\chtfonts\851gkktt24.fnt
GlyphWidth=24
GlyphHeight=20
; GlyphWidth / GlyphHeight 是「畫在畫面上」的大小，可以跟字型檔裡實際的字格不同、也可以不是正方形：
;   例如 19x19 的檔案填 GlyphWidth=19 / GlyphHeight=18 → 只取 19x18（預設裁掉最下面一列；想裁掉最上面一列就加 GlyphOffsetY=1）
;   比檔案大則多出來的部分補空白。GlyphOffsetX / GlyphOffsetY = 視窗左上角在檔案字格內的位置（預設 0，可為負數）
GlyphOffsetX=0
GlyphOffsetY=3
CharSpacing=0

; ═════════════════════ 中文折行規則（避頭尾點）═════════════════════
; 套用在所有「會自動折行」的中文文字（對話字幕、簡報文字…）。遊戲的字幕框最多兩行，多出來的會翻到下一頁，
; 所以規則不會讓行數變多：如果套用之後行數比單純折行多，那一段就維持單純折行。
[Wrap]
; 避頭尾點：1 = 開、0 = 關。
;   避頭點：NoLineStart 裡的字不會出現在行首（會把上一行最後一個字一起擠到下一行）
;   避尾點：NoLineEnd 裡的字不會出現在行尾（會跟後面的字一起換行）
;   NoSplit 裡的字連續出現兩個（例如 …… 、——）時不從中間拆開；它們本身可以出現在行首或行尾
Kinsoku=1
; 整段文字結尾的「。」如果剛好折到下一行、變成孤零零的一個字 → 直接不畫。1 = 開、0 = 關
DropFinalPeriod=1
; 連續的英數字符號（中間沒有空白，例如 00:19、2654.125、(Grathal)）視為一個詞，不從中間拆成兩行；換行時空白留在上一行。1 = 開、0 = 關
KeepWords=1
NoLineStart=。，、；：？！）」』》〉】〕］｝”’．,.:!?)]}
NoLineEnd=「『（《〈【〔［｛“‘([{
NoSplit=…—⋯―

; ═════════════════════ 開場字幕／製作名單（Hook3）═════════════════════
; 這個畫面的字不是 FONTS.FNT 字型，而是遊戲內建的「精靈圖大字」，由專用函式 DrawBigText（WC1 0x0046B85D）畫，
; 不經過 Hook1/Hook2，所以不用 Rule。英文每個字母的圖本身帶「由上到下的黃→橘漸層」（每一列一個調色盤索引）。
; 中文版：查翻譯表（鍵 = 該畫面的整段英文，含 \n）→ 自己排版 → 中文字形依列上漸層色；英文人名仍用遊戲原本的字母圖。
; 找不到翻譯、字型沒載入、或位址驗證失敗時，一律交還原函式（英文不變）。
[BigText]
Enable=1
; 用哪一套字型集（[Font.名稱] 的名稱）
Use=Intro24
; 漸層：auto = 啟動時用遊戲自己的 'I' 字母圖讀出每列的調色盤索引（log 會印出 "英文字母 #8 的漸層取樣"）
;       none = 不要漸層（用 Color）；或手動指定由上到下的調色盤索引，例如 Gradient=12,13,14,15（平均分配到字高）
Gradient=auto
; 色帶對齊方式：absolute = 中文的色帶跟英文字母圖「在同一個水平的列」同色（色帶厚度與英文相同，字比英文高的部分延用最上/最下一色）
;             stretch  = 把漸層拉伸到整個字高（每一條色帶都變厚）
GradientMode=absolute
; 色帶整體垂直位移（列，正=往下），用來微調中文與英文的色帶對齊
GradientOffset=0
; 每一欄像素的色帶邊界隨機上下位移 -N..+N 列（0~8），模仿英文字母圖「每欄色帶高低不一、參差不齊」的漸層；0 = 關閉（每一列整齊同色）
GradientJitter=2
; 連續幾欄共用同一個位移（1 = 每欄各自隨機；2~3 = 較粗的階梯）
GradientJitterRun=1
; 亂數種子：換一個數字就換一種參差；同一個種子每次開遊戲結果都一樣
GradientJitterSeed=0
; Gradient=none 或讀不到漸層時使用的單一調色盤索引（-1 = 不指定；讀不到又沒指定就維持英文）
Color=-1
; 含中文的行：行高 = 字高 + LineSpacing；純英文行（人名）行高 = LatinLine（原版 16）
LineSpacing=1
LatinLine=16
; 版面區域（原函式寫死 320x128，整段在這個區域內置中）
RegionWidth=320
RegionHeight=128
; 微調：中文字形整體垂直位移（正=往下）；中英混排行裡英文字母圖的垂直位移
YOffset=0
LatinYOffset=0

; ═════════════════════════ 規則 ═════════════════════════
; 【YOffset】每條規則、每套字型都可以寫 YOffset=數字（像素，正=往下、負=往上）挪動「中文字形」（英數字維持原位）。
;   規則的 YOffset 只影響該規則命中的文字；字型集的 YOffset 影響所有用這套字型的文字；兩者相加。
;   英數字是交給遊戲原生函式畫的，不受影響；遊戲的排版游標也不變（同一面板連續幾段文字不會累加位移）。
; 下面的呼叫端位址（Caller）、viewport 範圍，都是從你的 log（15 個標記、168 種呼叫情境）實際讀到的。
; 同樣的文字在不同畫面是由「不同函式」畫出來的，用 Caller 比 viewport 範圍更準。
; 優先序：Caller 規則(20) > 範圍規則(0)。
; ── （選用）簡報星圖面板的「備註」標題：遊戲自己設定為置中（對齊=2），所以預設會置中。
; 想讓它靠左，取消下面註解（Text 用萬用字元，因為原文是 "\nNotes\n"）。「備註」下面的內容（Proceed to…）本來就是靠左。
; [Rule.Notes_Left]
; Hook=2
; Text=*Notes*
; Align=left
; Priority=25
; Use=Small10
; Shrink=Tiny8

; ── 選單介面：畫面最底一列（寢室「喚醒 SAVE1」、酒吧「Talk to …」、其他走廊的提示都走這個函式）──
[Rule.Menu_BottomLine]
; 酒吧的「Talk to HUNTER.」、寢室的「Awaken SAVE1.」…都走這個函式；對齊由 Align=auto 依遊戲設定決定
Hook=2
Caller=0x00438CC4
Priority=20
Use=Middle12

; ── 對話框（確認框／讀檔／輸入存檔名／離開確認，共用 0x00466C79）──
; 注意：它們的 viewport 是暫時建立的，位址每次不同，而且寬度不一（99～185px），只能用 Caller 認
[Rule.DialogBox]
Hook=2
Caller=0x00466C79
Priority=20
Use=Middle12
Shrink=Small10,Tiny8

; ── 簡報室星航圖：右側文字面板（呼叫端第三層 0x00429940）──
[Rule.Briefing_Panel]
Hook=2
Caller=0x00429940
Priority=20
Use=Small10
Shrink=Tiny8

; ── 空戰星航圖（Confed Nav Scan）：右側文字面板（0x00429BA3；MISSION FLIGHT PATH/HOME BASE 是 0x004295D3/0x004295E9）──
[Rule.FlightMap_Panel]
Hook=2
Caller=0x00429BA3,0x004295D3,0x004295E9
Priority=20
Use=Small10
Shrink=Tiny8

; ── 空戰星航圖：下方「Location: x.y.z」那一行（0x00429849；它的第三層也是 0x00429BA3，所以優先序要比上面的面板規則高）──
[Rule.FlightMap_Location]
Hook=2
Caller=0x00429849
Priority=25
Use=Tiny8

; ── 兩種星航圖的左側地圖標籤（Hook1；簡報與空戰共用同一個函式 0x004289FC，所以字型必然相同）──
[Rule.NavMap_Labels]
Hook=1
Caller=0x004289FC
Priority=20
Use=Tiny8

; ── 對話字幕：依場景分開（用 Scene= 認場景；字幕區是 (0,152)-(319,199)）──
; 目前每個場景都用 Big15；想讓某個場景用不同大小，只要改那條規則的 Use=（或加 Shrink=）。
[Rule.Subtitle_Bar]
Hook=2
Rect=0,152,319,199
Scene=Bar
Priority=15
Use=Big15
YOffset=0

[Rule.Bar_Title]
; 酒吧畫面最上方的地點標題（全螢幕 viewport、y≈10）
Hook=2
Rect=0,0,319,199
Cursor=0,0,319,30
Scene=Bar
Priority=15
Use=Big15
YOffset=0

[Rule.Subtitle_Briefing]
Hook=2
Rect=0,152,319,199
Scene=Briefing
Priority=15
Use=Big15
YOffset=0

[Rule.Subtitle_HangarLanding]
; 停機坪：降落後機務員的字幕
Hook=2
Rect=0,152,319,199
Scene=HangarLanding
Priority=15
Use=Big15
YOffset=0

[Rule.Subtitle_Debrief]
; 任務報告室（Mission debriefing）
